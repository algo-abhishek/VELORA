<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — Velora</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner container">
    <a href="index.html" class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M2 17L9 4L12 11L15 6L22 17H2Z" fill="var(--brand)"/></svg>
      <span>Velora<small>Step Into Style</small></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <div class="nav-icons" style="margin-left:auto">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <svg id="themeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
      </button>
      <a class="icon-btn" href="wishlist.html" aria-label="Wishlist">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="badge" id="wishCount">0</span>
      </a>
      <a class="icon-btn" href="cart.html" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="badge" id="cartCount">0</span>
      </a>
      <span id="userNavArea"></span>
    </div>
  </div>
</header>

<div class="page-banner">
  <div class="container">
    <span style="color:var(--brand);font-weight:600">Get in Touch</span>
    <h1>Contact Us</h1>
  </div>
</div>

<section class="container section">
  <div class="contact-grid">
    <div>
      <div class="contact-card"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><div><strong>Store Address</strong><p style="color:var(--text-soft);font-size:14px">Delhi, India</p></div></div>
      <div class="contact-card"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.7 2Z"/></svg></span><div><strong>Call Us</strong><p style="color:var(--text-soft);font-size:14px">+91 9192939495 (Mon-Sat, 10am-7pm)</p></div></div>
      <div class="contact-card"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><div><strong>Email Us</strong><p style="color:var(--text-soft);font-size:14px">support@velora.example</p></div></div>
    </div>
    <div class="form-card">
      <h3>Send us a message</h3>
      <form onsubmit="submitContactForm(event)">
        <div class="form-field"><label>Your Name</label><input type="text" required></div>
        <div class="form-field"><label>Email Address</label><input type="email" required></div>
        <div class="form-field"><label>Message</label><textarea rows="5" required style="resize:vertical"></textarea></div>
        <button type="submit" class="btn btn-primary btn-block">Send Message</button>
      </form>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<footer>
  <div class="container foot-bottom" style="border-top:none;padding-top:0">
    <small>© <span id="year"></span> Velora. All Rights Reserved.Developed by Abhishek kumar</small>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  function submitContactForm(event) {
    event.preventDefault();
    showToast("Message sent! We will get back to you soon.");
    event.target.reset();
  }
</script>
</body>
</html>
