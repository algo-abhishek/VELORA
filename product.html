<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Product — Velora</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner container">
    <a href="index.html" class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M2 17L9 4L12 11L15 6L22 17H2Z" fill="var(--brand)"/></svg>
      <span>Velora<small>Step Into Style</small></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <form class="search-box" onsubmit="goSearch(event)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search for shoes...">
    </form>
    <div class="nav-icons">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <svg id="themeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
      </button>
      <a class="icon-btn" href="wishlist.html" aria-label="Wishlist">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="badge" id="wishCount">0</span>
      </a>
      <button class="icon-btn" id="cartBtn" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="badge" id="cartCount">0</span>
      </button>
      <span id="userNavArea"></span>
      <button class="icon-btn burger" onclick="toggleMobileMenu()" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="mobile-nav" id="mobileNav">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</header>

<div class="container breadcrumb">
  <a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span id="crumbProduct">Product</span>
</div>

<section class="container" style="padding-bottom:40px" id="productBox"></section>

<section class="container" style="padding-bottom:60px">
  <div class="section-head"><h2>Related Products</h2></div>
  <div class="prod-grid" id="relatedGrid"></div>
</section>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="cartDrawer">
  <div class="drawer-head">
    <h3>Your Cart</h3>
    <button class="icon-btn" id="closeDrawer" aria-label="Close cart">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <div class="total-row"><span>Total</span><span id="drawerTotal">₹0</span></div>
    <a href="cart.html" class="btn btn-primary btn-block">View Cart &amp; Checkout</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<footer>
  <div class="container foot-bottom" style="border-top:none;padding-top:0">
    <small>© <span id="year"></span> Velora. All Rights Reserved. Developed by Velora</small>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/drawer.js"></script>
<script src="js/product.js"></script>
</body>
</html>
