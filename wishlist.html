<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — Velora</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner container">
    <a href="index.html" class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M2 17L9 4L12 11L15 6L22 17H2Z" fill="var(--brand)"/></svg>
      <span>Velora<small>Step Into Style</small></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-icons" style="margin-left:auto">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <svg id="themeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
      </button>
      <a class="icon-btn" href="cart.html" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="badge" id="cartCount">0</span>
      </a>
      <span id="userNavArea"></span>
    </div>
  </div>
</header>

<div class="container breadcrumb"><a href="index.html">Home</a> / Wishlist</div>

<section class="container" style="padding-bottom:60px">
  <div class="section-head"><h2>Your Wishlist</h2></div>
  <div class="prod-grid" id="wishGrid"></div>
</section>

<div class="toast" id="toast"></div>

<footer>
  <div class="container foot-bottom" style="border-top:none;padding-top:0">
    <small>© <span id="year"></span> Velora. All Rights Reserved.Developed by Abhishek Kumar</small>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  function renderWishlistPage() {
    var wishIds = getWishlist();
    var grid = document.getElementById("wishGrid");

    var items = [];
    for (var i = 0; i < products.length; i++) {
      if (wishIds.indexOf(products[i].id) !== -1) {
        items.push(products[i]);
      }
    }

    if (items.length === 0) {
      grid.innerHTML =
        '<div class="no-results" style="grid-column:1/-1">' +
          '<div class="big-ico">❤</div>' +
          '<h3 style="color:var(--text)">Your wishlist is empty</h3>' +
          '<p>Tap the heart icon on any product to save it here.</p>' +
          '<a href="shop.html" class="btn btn-primary" style="margin-top:16px">Browse Shoes</a>' +
        '</div>';
      return;
    }

    var html = "";
    for (var j = 0; j < items.length; j++) {
      var item = items[j];
      var discount = Math.round(100 - (item.price / item.old * 100));

      html += '<div class="prod-card">';
      html +=   '<div class="prod-thumb">';
      html +=     '<span class="discount-tag">-' + discount + '%</span>';
      html +=     '<button class="wish-btn active" onclick="removeWish(' + item.id + ')">';
      html +=       '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
      html +=     '</button>';
      html +=     '<a href="product.html?id=' + item.id + '"><img src="' + item.img + '" alt="' + item.name + '"></a>';
      html +=   '</div>';
      html +=   '<div class="prod-body">';
      html +=     '<span class="prod-brand">' + item.brand + '</span>';
      html +=     '<h4><a href="product.html?id=' + item.id + '">' + item.name + '</a></h4>';
      html +=     '<div class="price-row"><span class="price">' + formatPrice(item.price) + '</span></div>';
      html +=     '<div class="stars">' + starsText(item.rating) + ' <span>(' + item.reviews + ')</span></div>';
      html +=     '<button class="add-cart-btn" onclick="addToCart(' + item.id + ', ' + item.sizes[0] + ', \'' + item.colors[0] + '\', 1)">Add to Cart</button>';
      html +=   '</div>';
      html += '</div>';
    }
    grid.innerHTML = html;
  }

  function removeWish(id) {
    toggleWishlist(id);
    renderWishlistPage();
  }

  renderWishlistPage();
</script>
</body>
</html>
